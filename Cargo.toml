[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
authors = ["Julius Henkelmann"]

# See https://tauri.app/concept/size/#cargo-configuration
# Dependencies and the decoding are optimized in development builds too:
# unoptimized, decoding and resampling a 30 s file takes seconds instead of
# milliseconds (a GO on a cue not loaded yet waits that long), and the
# loudness meter's true peak (4× oversampling) is some 50 times slower.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.jq-media]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
