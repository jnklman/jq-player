# Installers for Windows and Linux. Windows gets three installers:
# the regular NSIS one downloads WebView2 if it is missing, "-offline-setup"
# includes it, and an MSI (German, for managed deployment; skipped for
# pre-release versions, which MSI cannot express), plus a portable program
# file ("-portable.exe") that keeps its settings and caches in a "jQ Player
# Data" folder next to itself. The Windows build includes the ASIO host, built against
# Steinberg's ASIO SDK (pinned version, downloaded per build, not in the repo;
# GPLv3 or Steinberg's own license, which matters once builds are passed on).
#
# Runs only when asked to, not on every push:
# - Pushing a version tag (`git tag v0.2.0 && git push origin v0.2.0`) builds
#   and publishes a GitHub release with the installers. The tag must match the
#   app version; tags with a "-" (v0.2.0-beta.1) become pre-releases.
#   The release text is the version's section of CHANGELOG.md (for a
#   pre-release: "Unreleased"), see scripts/changelog.mjs.
#   The "Release" workflow does the whole thing (version bump, commit, tag).
# - "Run workflow" in the Actions tab builds a test version; the installers
#   are attached to the run as artifacts and expire after a few days.
#
# The tests (tests.yml) run first, unless the same content already passed
# them, typically in the pull request that was merged before the release.
#
# The updater files are signed with the repository secrets
# TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, empty if
# the key has none); the app only installs updates signed with its public key.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Version numbers in sync
        run: node scripts/version.mjs --check
      - name: Tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version=$(node scripts/version.mjs --print)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
      - name: Release notes in CHANGELOG.md
        if: github.ref_type == 'tag'
        run: node scripts/changelog.mjs notes "$GITHUB_REF_NAME"
      # Looks for the marker the Tests workflow leaves behind (see tests.yml),
      # for this commit's tree or, if this commit only sets the version and
      # updates the changelog (the Release workflow's commit), for its
      # parent's tree. That is checked by redoing it: the parent plus
      # `version.mjs <this version>` plus this CHANGELOG.md must give exactly
      # this tree.
      # Markers from pull requests out of forks do not count.
      - name: Tested before?
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          trees=("$tree")
          if git rev-parse -q --verify 'HEAD^' > /dev/null; then
            version=$(node scripts/version.mjs --print)
            git checkout -q --detach 'HEAD^'
            if node scripts/version.mjs "$version" > /dev/null &&
              git checkout -q "$GITHUB_SHA" -- CHANGELOG.md && git add -A &&
              [ "$(git write-tree)" = "$tree" ]; then
              trees+=("$(git rev-parse 'HEAD^{tree}')")
            fi
            git checkout -q -f "$GITHUB_SHA"
          fi
          for t in "${trees[@]}"; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tests-passed-$t" \
              --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length')
            if [ "$count" -gt 0 ]; then
              echo "Tests passed before for tree $t, skipping them."
              echo "tested=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No earlier test run for this content, running the tests."
          echo "tested=false" >> "$GITHUB_OUTPUT"

  tests:
    needs: check
    if: needs.check.outputs.tested != 'true'
    uses: ./.github/workflows/tests.yml

  bundle:
    needs: [check, tests]
    # Runs when the tests passed or were skipped because they passed before.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.tests.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            features: asio
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: System libraries (ALSA, JACK, PipeWire, WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      # bindgen in asio-sys needs LLVM, which the Windows runner has.
      - name: ASIO SDK
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/asiosdk.zip" "$ASIO_SDK_URL"
          echo "$ASIO_SDK_SHA256  $RUNNER_TEMP/asiosdk.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/asiosdk.zip" -d "$RUNNER_TEMP"
          echo "CPAL_ASIO_DIR=$RUNNER_TEMP/ASIOSDK" >> "$GITHUB_ENV"
        env:
          ASIO_SDK_URL: https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip
          ASIO_SDK_SHA256: d5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # Calls the Tauri CLI directly: the npm script's snap-environment
      # wrapper is only needed on developer machines.
      # The release config also signs the updater files (*.sig) with the key
      # from the secrets; local builds do without it.
      - name: Build installers
        shell: bash
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bundles="${{ matrix.bundles }}"
          # MSI versions allow only numeric pre-release identifiers.
          if [[ "$(node ../scripts/version.mjs --print)" == *-* ]]; then
            bundles="${bundles/,msi/}"
          fi
          npx tauri build --bundles "$bundles" --config src-tauri/tauri.release.conf.json ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      # Second Windows installer with the WebView2 runtime embedded, for
      # machines without internet. Uncompressed: NSIS compresses solid, so
      # with LZMA every install would have to unpack the ~180 MB runtime
      # even when it is skipped. Re-bundles the existing build.
      - name: Offline installer (with WebView2)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: app
        run: |
          dir=../target/release/bundle/nsis
          mv "$dir"/*-setup.exe "$RUNNER_TEMP"/
          npx tauri bundle --bundles nsis --config src-tauri/tauri.offline.conf.json
          for f in "$dir"/*-setup.exe; do mv "$f" "${f%-setup.exe}-offline-setup.exe"; done
          mv "$RUNNER_TEMP"/*-setup.exe "$dir"/
      # The portable program file (feature `portable`, see src/paths.rs). Needs
      # WebView2 on the machine, which Windows 10 and 11 have. Last, since it
      # replaces target/release/jq-player.exe the installers were made from;
      # only the app crate is compiled again. Not signed: it cannot update itself.
      - name: Portable program file
        if: runner.os == 'Windows'
        shell: bash
        working-directory: app
        run: |
          npx tauri build --no-bundle --features asio,portable
          version=$(node ../scripts/version.mjs --print)
          mkdir -p ../target/release/bundle/portable
          cp ../target/release/jq-player.exe "../target/release/bundle/portable/jQ Player_${version}_x64-portable.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: jq-player-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/portable/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          # Artifacts count against the Actions storage quota; a release keeps
          # its own copy, so the tag build only needs them for the next job.
          retention-days: ${{ github.ref_type == 'tag' && 1 || 5 }}

  release:
    # Without a status function, `if` implies success(), which also needs the
    # skipped tests job (a dependency of bundle) to have succeeded.
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.bundle.result == 'success' }}
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app's updater reads this file from the latest release.
          node scripts/updater-manifest.mjs dist "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > latest.json
          node scripts/changelog.mjs notes "$GITHUB_REF_NAME" > notes.md
          # Artifacts keep their bundle subfolders (nsis/, portable/, deb/, appimage/).
          mapfile -t files < <(find dist -type f ! -name '*.sig')
          files+=(latest.json)
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "jQ Player ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --verify-tag "${flags[@]}"
