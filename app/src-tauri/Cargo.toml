[package]
name = "jq-player"
description = "jQ Player – cue player for theatre operation"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "jq_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
# raw_value: the show view is serialized once and sent as it is (`backend::publish`).
serde_json = { version = "1", features = ["raw_value"] }
jq-audio = { path = "../../crates/jq-audio" }
jq-core = { path = "../../crates/jq-core" }
jq-engine = { path = "../../crates/jq-engine" }
jq-i18n = { path = "../../crates/jq-i18n" }
jq-media = { path = "../../crates/jq-media" }
jq-midi = { path = "../../crates/jq-midi" }
jq-show = { path = "../../crates/jq-show" }
# Remote control (src/remote): web page and WebSocket for other devices, on a
# thread and runtime of their own (tokio is in the tree via Tauri).
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1", "json"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
getrandom = "0.3"
sha2 = "0.10"
# The addresses the remote page is reached at, and a QR code of each.
if-addrs = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
# A WebSocket client for the remote server's tests.
tokio-tungstenite = "0.29"
futures-util = "0.3"
tokio = { version = "1", features = ["io-util"] }

# ASIO host on Windows, see crates/jq-audio/Cargo.toml.
[features]
asio = ["jq-audio/asio"]
# Portable build: settings, caches and webview data in "jQ Player Data" next
# to the executable instead of the user's folders (see src/paths.rs).
portable = []

[target.'cfg(windows)'.dependencies]
# Message box before Tauri starts (already in the tree via tauri-plugin-dialog).
rfd = { version = "0.17", default-features = false }
# Window border colour (already in the tree via Tauri).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Key labels of the current layout (already in the tree via Tauri).
gtk = "0.18"
